# tmux 配置

# prefix 改为 Ctrl+a（小拇指 + 无名指，比默认 Ctrl+b 更顺手）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 窗口编号从 1 开始（0 太远）
set -g base-index 1


# 鼠标支持：点击 pane 聚焦、滚轮滚动
set -g mouse on

# 键盘序列透传：让 Option+Arrow、Cmd+Backspace 等正常工作
set -g xterm-keys on
set -gw xterm-keys on
set -g default-terminal "xterm-256color"

# ESC 等待时间设为 10ms（默认 500ms，导致 Option+Arrow 卡顿失效）
set -g escape-time 10

# 扩展键序列：让 Shift+Enter 等组合键在 Claude Code 里正常工作
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 分屏快捷键更直觉：\ 左右分，- 上下分
bind \\ split-window -h
bind - split-window -v

# 把当前 pane 移动到下一个窗口
bind m join-pane -t :+1

# 快速布局：w=左右两栏 e=左右三栏 r=四宫格（保留已有 pane）
bind w run 'panes=$(tmux list-panes | wc -l | tr -d " "); if [ $panes -lt 2 ]; then tmux split-window -h; fi; tmux select-layout even-horizontal'
bind e run 'panes=$(tmux list-panes | wc -l | tr -d " "); if [ $panes -lt 2 ]; then tmux split-window -h; fi; if [ $panes -lt 3 ]; then tmux split-window -h; fi; tmux select-layout even-horizontal'
bind r run 'panes=$(tmux list-panes | wc -l | tr -d " "); if [ $panes -lt 2 ]; then tmux split-window -h; fi; if [ $panes -lt 3 ]; then tmux split-window -v; fi; if [ $panes -lt 4 ]; then tmux select-pane -t 1; tmux split-window -v; fi; tmux select-layout tiled'

# 当前窗口高亮：白色加粗，蓝色背景
set -g window-status-current-style 'fg=white,bold,bg=blue'
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, [Z],} '

# 非当前窗口：暗色
set -g window-status-style 'fg=colour244'
set -g window-status-format ' #I:#W '

# 状态栏内容：CPU / 内存 / Docker 容器数 / 时间
set -g status-right '#{cpu_percentage} CPU | #{ram_percentage} RAM | Docker: #(docker ps -q 2>/dev/null | wc -l | tr -d " ") | %H:%M'
set -g status-right-length 80

# TPM 插件
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-continuum：启动时自动恢复，每 15 分钟自动保存
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
